[project]
name = "jp-epub-reader"
version = "0.1.0"
description = "Interactive Japanese EPUB reader with monolingual-first lookup and grammar Q&A"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sudachipy>=0.6.8",
    "sudachidict-core>=20240716",
    "jamdict>=0.1a11.post2",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "httpx>=0.27",
    "google-genai>=1.0",
    "pydantic>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv]
link-mode = "copy"

